server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx
    server_tokens off;

    # El panel no debe embeberse en otra página ni adivinar tipos MIME.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # style-src necesita 'unsafe-inline' porque el panel usa el atributo style
    # de React en varios componentes. Las fuentes (Figtree/JetBrains Mono) se
    # sirven desde el propio panel (/fonts), sin terceros. No se
    # añade Strict-Transport-Security: este nginx sirve por HTTP tal cual se
    # despliega (sin TLS propio), y HSTS con TLS solo en el reverse proxy de
    # cada quien podría dejar el panel inaccesible por HTTP para siempre.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 2m por defecto (la API es JSON pequeño); las subidas de archivos tienen su propia location con 250m.
    client_max_body_size 2m;  # el resto de la API es JSON pequeño: un cuerpo grande sin autenticar no se almacena

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Sin esta regla, /health cae en el catch-all de la SPA y devuelve 200 con
    # el HTML del panel: un monitor externo veria verde con el backend muerto.
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # API proxy al backend
    # Subidas de archivos: hasta 250m (acompaña MAX_UPLOAD_BYTES de acls.py y backup.py).
    location ~ ^/api/(acls/bulk-domains|backup/|kerberos/keytab|proxy-users/import) {
        client_max_body_size 250m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 600s: acompaña el timeout de squid -k parse/reconfigure (ver
        # runtime/docker_runtime.get_docker_client) -con una ACL de archivo
        # de millones de dominios, Squid puede tardar bastante más de 120s
        # en cargarla al validar/recargar la configuración.
        proxy_read_timeout 600s;
    }

    # Los archivos generados por la build llevan un hash en el nombre
    # (index-XXXXXXXX.js): si cambian, cambia el nombre, asi que se pueden
    # cachear de forma agresiva sin riesgo de servir una version vieja.
    location /assets/ {
        # nginx NO hereda los add_header del server en una location que declara el suyo:
        # se repiten aqui, o la SPA saldria sin CSP ni X-Frame-Options.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html SIEMPRE se revalida: es el que apunta al bundle con el hash
    # actual, asi que si el navegador lo cachea sin avisar, el panel puede
    # quedarse mostrando una version anterior sin que se note.
    location = /index.html {
        # nginx NO hereda los add_header del server en una location que declara el suyo:
        # se repiten aqui, o la SPA saldria sin CSP ni X-Frame-Options.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        # nginx NO hereda los add_header del server en una location que declara el suyo:
        # se repiten aqui, o la SPA saldria sin CSP ni X-Frame-Options.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
