server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx
    server_tokens off;

    # El panel no debe embeberse en otra página ni adivinar tipos MIME.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Tope para las subidas de backup/import
    client_max_body_size 10m;

    # Sin esta regla, /health cae en el catch-all de la SPA y devuelve 200 con
    # el HTML del panel: un monitor externo veria verde con el backend muerto.
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # API proxy al backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los archivos generados por la build llevan un hash en el nombre
    # (index-XXXXXXXX.js): si cambian, cambia el nombre, asi que se pueden
    # cachear de forma agresiva sin riesgo de servir una version vieja.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html SIEMPRE se revalida: es el que apunta al bundle con el hash
    # actual, asi que si el navegador lo cachea sin avisar, el panel puede
    # quedarse mostrando una version anterior sin que se note.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
