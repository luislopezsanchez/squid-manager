#Mecanismo Autenticacion NTLM
auth_param ntlm program /usr/bin/ntlm_auth --helper-protocol=squid-2.5-ntlmssp --domain=EXAMPLECORP
auth_param ntlm children 30 startup=5 idle=1
auth_param ntlm keep_alive off

#NTLM GROUP
external_acl_type ad_group ttl=10 children-max=20 children-startup=10 %LOGIN /usr/lib/squid/ext_wbinfo_group_acl

cache_peer parent.example.com parent 81 0 no-query no-digest default

#Puertos
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 81          # proxy
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 3128        # proxy

acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

acl proxy src 10.10.10.6/32

#Administrar la cache
http_access allow localhost manager
http_access allow proxy manager
http_access deny manager

#Acl Tiempo
acl timework time MTWHFA 07:00-18:00

#Dominio Nacional
acl nacional dstdomain .localtld
deny_info ERR_NO_NACIONAL nacional

#Sitios Delay
#acl delay_domains_servers dstdomain "/etc/squid/files/delay_domains_servers"
#acl delay_sites_users url_regex -i "/etc/squid/files/delay_sites_users"

#Denegando usuario simultaneo
acl usuarios_por_pc max_user_ip 1

#Grupos de navegacion.
acl gnacional external ad_group nacional
acl ginternet external ad_group internet
acl grrss external ad_group rrss


#Delay Pools
#delay_pools 2
#delay_class 1 2
#delay_parameters 1 -1/-1 32768/1048576

#delay_class 2 1
#delay_parameters 2 1000/100

#Acl PCs
include /etc/squid/acl-pcs.conf

##Permitiendo Acceso.
include /etc/squid/access-pcs.conf

http_access deny all

http_port 10.10.10.6:3128

cache_mem 1500 MB

cache_dir ufs /var/spool/squid 2048 16 256
access_log daemon:/var/log/squid/access.log squid
cache_store_log daemon:/var/log/squid/store.log
cache_log /var/log/squid/cache.log

debug_options ALL,1

coredump_dir /var/spool/squid

ftp_user Squid@

#squidGuard
url_rewrite_program /usr/bin/squidGuard
url_rewrite_children 30 startup=10 idle=1 concurrency=0

refresh_pattern ^ftp:		1440	20%	10080
refresh_pattern ^gopher:	1440	0%	1440
refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
refresh_pattern (Release|Packages(.gz)*)$      0       20%     2880
refresh_pattern .		0	20%	4320

dns_nameservers 10.10.10.2

cache_mgr postmaster@example.com

visible_hostname proxy.example.com

error_default_language Spanish

cachemgr_passwd REDACTED_PASSWORD all

