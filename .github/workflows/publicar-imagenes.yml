# Construye las tres imagenes de SquidManager, las PRUEBA arrancando el stack completo con install-imagenes.sh y,
# solo si la prueba pasa, les pone las etiquetas publicas (version y latest) en ghcr.io.
#
# Cuando corre:
#   - al publicar una etiqueta de version (git tag v1.0.1 && git push origin v1.0.1)
#   - a mano: Actions > "Publicar imagenes" > Run workflow
#
# Imagenes: ghcr.io/<propietario>/squid-manager-backend | -squid | -frontend   (solo linux/amd64)
# La primera vez los paquetes quedan PRIVADOS: hay que hacerlos publicos (Packages > Package settings > Change visibility).
name: Publicar imagenes

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRO: ghcr.io/${{ github.repository_owner }}

jobs:
  construir:
    name: Construir ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        servicio: [backend, squid, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir con la etiqueta del commit
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRO }}/squid-manager-${{ matrix.servicio }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=squid-manager-${{ matrix.servicio }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  probar:
    name: Probar la instalacion con imagenes
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: El compose de imagenes esta al dia
        run: python3 .github/scripts/generar_compose_imagenes.py --check

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dar a root las credenciales del registro (los paquetes nuevos son privados)
        run: |
          sudo mkdir -p /root/.docker
          sudo cp "$HOME/.docker/config.json" /root/.docker/config.json

      - name: Instalar con install-imagenes.sh
        env:
          SQUIDMGR_DIR: /opt/squid-manager
          SQUIDMGR_FUENTE: ${{ github.workspace }}
          SQUIDMANAGER_VERSION: sha-${{ github.sha }}
          SQUIDMANAGER_REGISTRY: ${{ env.REGISTRO }}
          WEB_PORT: "3000"
          PROXY_PORT: "3128"
        run: sudo --preserve-env bash install-imagenes.sh

      - name: Comprobar el panel y el proxy
        run: |
          cd /opt/squid-manager
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health && break; sleep 3; done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
          # La pagina principal del panel carga
          curl -fsS http://127.0.0.1:3000/ | grep -qi '<div id="root">'
          # El login con una contrasena mala responde 401 (la API y la base de datos funcionan)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/auth/login -d 'username=admin&password=mala')" = "401"
          # Squid esta sano
          for i in $(seq 1 40); do
            [ "$(sudo docker inspect squidmgr-proxy --format '{{.State.Health.Status}}')" = "healthy" ] && break; sleep 3
          done
          test "$(sudo docker inspect squidmgr-proxy --format '{{.State.Health.Status}}')" = "healthy"

      - name: Registros si algo fallo
        if: failure()
        run: |
          cd /opt/squid-manager && sudo docker compose ps || true
          sudo docker compose logs --tail=80 || true

  publicar:
    name: Etiquetas publicas
    needs: probar
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular la version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="manual-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Poner latest y la version a las tres imagenes
        run: |
          for s in backend squid frontend; do
            origen="${REGISTRO}/squid-manager-${s}:sha-${GITHUB_SHA}"
            docker buildx imagetools create -t "${REGISTRO}/squid-manager-${s}:${{ steps.version.outputs.v }}" -t "${REGISTRO}/squid-manager-${s}:latest" "$origen"
          done
