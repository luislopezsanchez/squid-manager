name: CI

# Antes de este workflow, la única red de seguridad de 211 tests era que
# alguien se acordara de correr `pytest` a mano. Este workflow corre la
# suite en los dos Python que el proyecto declara soportar (README/docs),
# y deja constancia de vulnerabilidades conocidas en las dependencias sin
# bloquear el build por una que ya está evaluada y aceptada (ver
# CHANGELOG.md, sección "Dependencias" de cada versión, para el criterio
# de cada una).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        working-directory: backend
        env:
          # Ningún test se conecta de verdad a Postgres (usan FakeDB/mocks),
          # pero Settings() exige la variable desde que se le quitó el
          # default con pinta de credencial real (ver backend/app/config.py).
          DATABASE_URL: postgresql+psycopg://test:test@localhost/test_no_se_usa
        run: pytest tests/ -q

      - name: Auditoría de dependencias (informativo)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "::warning::pip-audit encontró CVEs — revisar antes de la próxima release"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Auditoría de dependencias (solo alta/crítica)
        working-directory: frontend
        # --audit-level=high: umbral general, no una excepción puntual (la
        # única vulnerabilidad conocida hasta ahora, en react-router-dom, ya
        # se cerró con la migración a v7 -ver CHANGELOG.md-). Deja pasar algo
        # moderado nuevo sin investigar, pero corta ante cualquier cosa grave.
        run: npm audit --omit=dev --audit-level=high
