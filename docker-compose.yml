services:
  # ============================================
  # PostgreSQL - Base de datos
  # ============================================
  db:
    # pgvector/pgvector, no postgres:16-alpine a secas: mismo Postgres 16,
    # con la extension pgvector ya integrada (la usa el asistente de IA para
    # buscar en la documentacion por significado). El :16-alpine oficial no
    # la trae compilada.
    image: pgvector/pgvector:pg16
    container_name: squidmgr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-squidmanager}
      POSTGRES_USER: ${DB_USER:-squid}
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en el .env}
      # Locale C.UTF-8 al inicializar la base: orden de texto por byte (como
      # --lc-collate=C que usa install-nativo.sh en modo nativo), pero ctype
      # UTF-8 (upper/lower y clases de caracteres funcionan con acentos).
      #
      # Motivo: las versiones anteriores traian postgres:16-alpine, que
      # inicializaba en_US.utf8 bajo musl -y musl NO registra version de
      # collation-. Al pasar a pgvector/pgvector:pg16 (glibc), el ORDEN de
      # los indices btree de texto cambia y Postgres NO avisa (no hay
      # version previa que comparar): los indices quedan logicamente
      # corruptos -confirmado con amcheck: "item order invariant violated"
      # en el UNIQUE de proxy_users.username-. C.UTF-8 no tiene version de
      # collation, asi que una base creada asi es inmune a cualquier cambio
      # futuro de imagen o de libc.
      #
      # Solo afecta a un volumen que se inicializa DE CERO. Un volumen que ya
      # existe conserva su locale -para esos, upgrade-docker.sh hace REINDEX
      # una sola vez, ver el script y docs/actualizacion.md-.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres corre todo lo que hay acá como superusuario, una sola vez,
      # al inicializar un volumen de datos vacío -no en cada arranque-.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - squidnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-squid}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Docker Socket Proxy - acceso acotado a la API de Docker
  # ============================================
  # El backend necesita hablar con el daemon Docker (recrear Squid al cambiar
  # de puerto, exec_run para reconfigure/reload, leer estadisticas), pero
  # montarle /var/run/docker.sock directamente le da acceso COMPLETO a la API
  # -equivalente a root del host- ante cualquier RCE en el backend. Este
  # proxy (Tecnativa/docker-socket-proxy, muy usado para esto) se pone en
  # medio: solo el permite las llamadas que el backend usa de verdad, y
  # bloquea explicitamente todo lo demas (build de imagenes, swarm, secrets,
  # plugins, nodos, servicios, sesion, auth).
  #
  # Limite real, no un detalle: crear un contenedor nuevo (necesario para
  # `docker compose up -d --force-recreate` al cambiar el puerto) requiere
  # CONTAINERS=1 + POST=1, y el proxy no distingue "crear un contenedor" de
  # "crear un contenedor con configuracion peligrosa" -no hay una variable
  # mas fina para eso. Esto reduce mucho la superficie de ataque frente a
  # docker.sock sin restriccion (cierra build/swarm/secrets/plugins/nodos por
  # completo), pero no la cierra del todo: alguien con RCE en el backend
  # todavia podria, en teoria, crear un contenedor malicioso. Cerrar eso del
  # todo exigiria un demonio aparte fuera del backend con una API propia y
  # minima -un rediseno mas grande, pendiente como mejora futura.
  docker-socket-proxy:
    # Version fija, no ":latest": esta imagen es la que decide que llamadas a
    # la API de Docker se permiten -un cambio de comportamiento aguas arriba
    # podria abrir o cerrar capacidades sin que nadie lo pida, y sin quedar
    # registrado en ningun commit (auditoria 2026-09-09, hallazgo 06-002).
    image: tecnativa/docker-socket-proxy:0.3
    container_name: squidmgr-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      POST: 1
      ALLOW_RESTARTS: 1
      # Todo lo demas queda en su valor por defecto (0/deshabilitado):
      # BUILD, COMMIT, CONFIGS, DISTRIBUTION, GRPC, INFO, NODES, PLUGINS,
      # SERVICES, SESSION, SWARM, SYSTEM, TASKS, AUTH, SECRETS.
    volumes:
      # :ro por buena practica (defensa en profundidad), aunque al ser un
      # socket Unix esto no restringe por si solo las operaciones de
      # escritura sobre la API -esa restriccion la hace el propio proxy
      # segun las variables de arriba, no el modo de montaje.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - squidnet
    # Sin exponer nada hacia fuera: solo el backend le habla, por la red
    # interna, con el nombre del servicio como host.

  # ============================================
  # Backend - FastAPI (Python)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: squidmgr-backend
    restart: unless-stopped
    # Limite conservador: una reindexacion del asistente de IA (llamadas a
    # Jina por cada fragmento de la documentacion) es lo mas pesado que corre
    # aca. Sin limite, un pico se lleva la RAM del host y arrastra a
    # PostgreSQL con el; con el limite, el OOM killer se lleva SOLO este
    # contenedor (auditoria 2026-09-09, hallazgo 12-001). Ver
    # docs/production.md para el hardware minimo recomendado; si el panel
    # empieza a reiniciarse solo bajo carga real, subir este valor antes que
    # quitarlo.
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-squid}:${DB_PASS:?Define DB_PASS en el .env}@db:5432/${DB_NAME:-squidmanager}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el .env (openssl rand -hex 32)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE:-480}
      SQUID_CONFIG_PATH: /etc/squid/squid.conf
      SQUID_CONTAINER_NAME: squidmgr-proxy
      DEBUG: ${DEBUG:-false}
      # Orígenes permitidos por CORS. Vacío = ninguno, que es lo correcto
      # cuando el frontend se sirve desde el mismo origen vía nginx.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Solo se acepta X-Forwarded-For si la petición viene de estos hosts.
      TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-frontend}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # Directorio del proyecto, para que el backend pueda invocar
      # `docker compose up -d squid` al cambiar el puerto y mantener el .env
      # sincronizado con la base de datos.
      PROJECT_DIR: ${PROJECT_DIR:-/opt/squid-manager}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-squid-manager}
      # El SDK de Docker (docker-py) y el propio CLI `docker` respetan esta
      # variable sin cambios de código: hablan con el proxy de arriba en vez
      # de con el socket real, tanto para las llamadas directas del backend
      # como para los `docker compose ...` que lanza como subproceso.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - squid-config:/etc/squid
      - squid-spool:/var/spool/squid
      - squid-logs:/var/log/squid
      # El proyecto se monta en la MISMA ruta que tiene en el host. Compose
      # graba su directorio de trabajo en las etiquetas del contenedor: si el
      # backend lo viera en otra ruta, cada `docker compose up -d` lanzado a
      # mano detectaría una diferencia y recrearía Squid sin necesidad.
      #
      # Riesgo aceptado (auditoría 2026-09-09, hallazgo 11-002): este
      # volumen incluye el .env con SECRET_KEY y DB_PASS, montado con
      # permiso de escritura -cualquier ejecución de código en el backend
      # puede leerlo entero, lo que reduce el valor de correr como usuario
      # sin privilegios frente a este vector concreto. Decisión deliberada:
      # el backend necesita ejecutar `docker compose up -d squid` con el
      # mismo working_dir que grabó Compose y mantener PROXY_PORT
      # sincronizado. Cerrarlo del todo exige el "demonio aparte con API
      # mínima" que ya se menciona como mejora futura más abajo (mismo
      # rediseño que resolvería el límite que queda con el socket-proxy) —
      # ahí, montar solo docker-compose.yml y .env en :ro en vez del árbol
      # entero.
      - ${PROJECT_DIR:-/opt/squid-manager}:${PROJECT_DIR:-/opt/squid-manager}
    # El puerto 8000 NO se publica: el frontend habla con el backend por la red
    # interna. Exponerlo dejaba la API accesible sin pasar por nginx.
    expose:
      - "8000"
    networks:
      - squidnet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Squid - Proxy Server
  # ============================================
  squid:
    build:
      context: ./squid
      dockerfile: Dockerfile
    container_name: squidmgr-proxy
    restart: unless-stopped
    # Limite conservador: un cache_mem mal puesto desde el panel puede pedir
    # mucha mas RAM de la que el host tiene (auditoria 2026-09-09, hallazgo
    # 12-001). Ver docs/production.md; si el proxy se reinicia solo con
    # trafico real, subir este valor antes que quitarlo -y revisar
    # cache_mem/cache_dir en Configuracion primero, que es la causa mas
    # probable.
    mem_limit: 1g
    depends_on:
      backend:
        condition: service_started
    volumes:
      - squid-config:/etc/squid
      - squid-spool:/var/spool/squid
      - squid-logs:/var/log/squid
      - squid-crtd:/var/lib/ssl_crtd
    # Squid escucha SIEMPRE en 3128 dentro del contenedor; lo único que cambia
    # al elegir otro puerto en el panel es la parte publicada. Así el puerto
    # vive en un solo sitio (PROXY_PORT) en lugar de dos que había que
    # mantener iguales a mano.
    ports:
      - "${PROXY_PORT:-3128}:3128"
    networks:
      - squidnet
    tty: true
    stdin_open: true
    healthcheck:
      # No basta con que el proceso viva: hay que comprobar que Squid acepta
      # conexiones de verdad. Con la comprobación anterior, un Squid que no
      # llegaba a abrir su puerto figuraba como «sano».
      test: >-
        squid -k check || exit 1;
        timeout 3 bash -c "</dev/tcp/127.0.0.1/3128" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Frontend - React (Vite)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: squidmgr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - squidnet
    healthcheck:
      # 127.0.0.1 y no localhost: en Alpine, localhost resuelve primero a ::1
      # y nginx solo escuchaba IPv4, así que el healthcheck fallaba siempre
      # aunque el servicio funcionara.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ============================================
# Volúmenes persistentes
# ============================================
volumes:
  pgdata:
  squid-config:
  squid-spool:
  squid-logs:
  squid-crtd:

# ============================================
# Red interna
# ============================================
networks:
  squidnet:
    driver: bridge
